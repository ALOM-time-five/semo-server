<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.4.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>WebSocket Chat Test</h2>
<div>
    <input type="text" id="messageInput" placeholder="Enter message">
    <button onclick="sendMessage()">Send</button>
</div>
<div>
    <h3>Messages:</h3>
    <pre id="messages"></pre>
</div>

<script>
    var socket = new SockJS('http://localhost:8080/stomp/chat'); // 연결을 위한 엔드포인트 설정
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);

        stompClient.subscribe('/sub/chat/room/12345', function (messageOutput) {
            showMessageOutput(messageOutput.body);
        });
    });

    function sendMessage() {
        var messageInput = document.getElementById('messageInput');
        var message = {
            sender: 'User1',
            senderImageUrl: 'https://example.com/image.png',
            content: messageInput.value,
            roomId: '12345'
        };
        stompClient.send("/pub/chat.sendMessage", {}, JSON.stringify(message));
        messageInput.value = '';
    }

    function showMessageOutput(message) {
        var messages = document.getElementById('messages');
        messages.innerHTML += message + '\n';
    }
</script>
</body>
</html>
